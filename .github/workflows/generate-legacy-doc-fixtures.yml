name: generate-legacy-doc-fixtures

on:
  push:
    branches: [build/phase-10]
    paths:
      - .github/workflows/generate-legacy-doc-fixtures.yml

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout build branch
        uses: actions/checkout@v4
        with:
          ref: build/phase-10

      - name: Install LibreOffice fixture authoring tool
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y libreoffice-writer

      - name: Generate explicit Word 97-2003 spike corpus
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import base64, html, os, struct, subprocess, tempfile

          repo = Path.cwd()
          target = repo / 'tests/WordToExcel.Tests/Fixtures/LegacyDoc'
          target.mkdir(parents=True, exist_ok=True)
          work = Path(tempfile.mkdtemp(prefix='legacy-doc-authoring-'))

          pages = {
              'simple-table': '<table border="1"><tr><td>A</td><td>B</td></tr><tr><td>C</td><td>D</td></tr></table>',
              'multiple-tables': 'BEFORE<table border="1"><tr><td>T1A</td><td>T1B</td></tr></table>BETWEEN<table border="1"><tr><td>T2A</td><td>T2B</td></tr></table>AFTER',
              'merged-cells': '<table border="1"><tr><td colspan="2">MERGED</td></tr><tr><td>LEFT</td><td>RIGHT</td></tr></table>',
              'irregular-rows': '<table border="1"><tr><td colspan="2">WIDE</td><td>R0C2</td></tr><tr><td>R1C0</td><td>R1C1</td><td>R1C2</td></tr><tr><td colspan="3">ALL</td></tr></table>',
              'unicode-cyrillic': '<meta charset="utf-8"><table border="1"><tr><td>Привет</td><td>ёж — Москва</td></tr></table>',
              'leading-zero-codes': '<table border="1"><tr><td>Код</td><td>001234</td></tr></table>',
              'long-numeric-identifiers': '<table border="1"><tr><td>ID</td><td>12345678901234567890</td></tr></table>',
              'surrounding-text': '<meta charset="utf-8"><p>Текст до таблицы</p><table border="1"><tr><td>ЦЕНТР</td></tr></table><p>Текст после таблицы</p>',
              'nested-table': '<meta charset="utf-8"><table border="1"><tr><td>Родитель<table border="1"><tr><td>Вложенные данные</td></tr></table></td></tr></table>',
          }

          png = base64.b64decode('iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAQAAAC1HAwCAAAAC0lEQVR42mNk+A8AAQUBAScY42YAAAAASUVORK5CYII=')
          (work / 'pixel.png').write_bytes(png)
          pages['embedded-image'] = '<meta charset="utf-8"><table border="1"><tr><td>Таблица с изображением рядом</td></tr></table><p><img src="pixel.png" alt="fixture-image"></p>'

          for name, body in pages.items():
              source = work / f'{name}.html'
              source.write_text(f'<!doctype html><html><head><meta charset="utf-8"></head><body>{body}</body></html>', encoding='utf-8')
              subprocess.run([
                  'libreoffice', '--headless', '--convert-to', 'doc:MS Word 97', '--outdir', str(target), str(source)
              ], check=True)
              output = target / f'{name}.doc'
              if not output.exists():
                  raise RuntimeError(f'LibreOffice did not create {output}')

          # The protected fixture is a structurally valid generated .doc with the
          # WordDocument FIB fEncrypted bit set. The spike must detect/reject it
          # before attempting conversion; no password or external Office runtime is used.
          protected = bytearray((target / 'simple-table.doc').read_bytes())
          if protected[:8] != bytes.fromhex('D0CF11E0A1B11AE1'):
              raise RuntimeError('Unexpected compound-file signature')
          sector_size = 1 << struct.unpack_from('<H', protected, 30)[0]
          fat_count = struct.unpack_from('<I', protected, 44)[0]
          first_dir = struct.unpack_from('<I', protected, 48)[0]
          difat = list(struct.unpack_from('<109I', protected, 76))
          fat_sectors = [x for x in difat if x < 0xFFFFFFFA][:fat_count]
          fat = []
          for sector in fat_sectors:
              offset = 512 + sector * sector_size
              fat.extend(struct.unpack_from(f'<{sector_size // 4}I', protected, offset))

          def chain(start):
              result = []
              current = start
              while current < 0xFFFFFFFA and current not in result:
                  result.append(current)
                  current = fat[current]
              return result

          directory = bytearray()
          for sector in chain(first_dir):
              offset = 512 + sector * sector_size
              directory += protected[offset:offset + sector_size]

          word_start = None
          for offset in range(0, len(directory), 128):
              entry = directory[offset:offset + 128]
              if len(entry) < 128:
                  continue
              name_length = struct.unpack_from('<H', entry, 64)[0]
              name = entry[:max(0, name_length - 2)].decode('utf-16le', 'ignore') if name_length >= 2 else ''
              if name == 'WordDocument':
                  word_start = struct.unpack_from('<I', entry, 116)[0]
                  break
          if word_start is None:
              raise RuntimeError('WordDocument stream not found')
          word_first_sector = chain(word_start)[0]
          fib_offset = 512 + word_first_sector * sector_size
          flags = struct.unpack_from('<H', protected, fib_offset + 10)[0] | 0x0100
          struct.pack_into('<H', protected, fib_offset + 10, flags)
          (target / 'protected.doc').write_bytes(protected)

          # Deliberately invalid/truncated compound file.
          simple = (target / 'simple-table.doc').read_bytes()
          (target / 'damaged.doc').write_bytes(simple[:1024])

          expected = {
              'simple-table.doc','multiple-tables.doc','merged-cells.doc','irregular-rows.doc',
              'unicode-cyrillic.doc','leading-zero-codes.doc','long-numeric-identifiers.doc',
              'surrounding-text.doc','nested-table.doc','embedded-image.doc','protected.doc','damaged.doc'
          }
          actual = {p.name for p in target.glob('*.doc')}
          if actual != expected:
              raise RuntimeError(f'Unexpected corpus: {sorted(actual)}')
          PY

      - name: Commit generated binary fixtures to build branch
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/WordToExcel.Tests/Fixtures/LegacyDoc/*.doc
          git diff --cached --quiet && exit 0
          git commit -m "test(t005): materialize legacy DOC spike fixtures"
          git push origin HEAD:build/phase-10
