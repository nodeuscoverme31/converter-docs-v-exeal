name: bootstrap-check

on:
  push:
    branches: [main]
  pull_request:

jobs:
  bootstrap:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.401

      - name: Version
        shell: pwsh
        run: dotnet --info

      - name: Restore locked dependencies
        shell: pwsh
        run: dotnet restore WordToExcel.sln --locked-mode

      - name: Build
        shell: pwsh
        run: dotnet build WordToExcel.sln -c Release --no-restore

      - name: Test
        shell: pwsh
        run: dotnet test tests/WordToExcel.Tests/WordToExcel.Tests.csproj -c Release --no-build

      - name: Format check
        shell: pwsh
        run: dotnet format WordToExcel.sln --verify-no-changes --no-restore

      - name: Bootstrap smoke
        shell: pwsh
        run: dotnet run --project src/WordToExcel.App/WordToExcel.App.csproj -c Release --no-build -- --bootstrap-smoke

      - name: Publish portable folder
        shell: pwsh
        run: dotnet publish src/WordToExcel.App/WordToExcel.App.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=false -p:PublishTrimmed=false

      - name: Verify publish output
        shell: pwsh
        run: |
          $exe = Get-ChildItem src/WordToExcel.App/bin/Release/net10.0-windows/win-x64/publish/WordToExcel.App.exe -ErrorAction Stop
          if (-not $exe) { throw "Published executable not found" }
          Write-Host "Published executable: $($exe.FullName)"

      - name: Verify canonical bootstrap docs
        shell: pwsh
        run: |
          $required = @(
            'AGENTS.md',
            'docs/project/01_PROJECT_INTENT.md',
            'docs/project/02_MVP_SPEC.md',
            'docs/project/03_PROJECT_RULES.md',
            'docs/project/04_PRODUCT_UX_DESIGN.md',
            'docs/project/05_VISUAL_UI_DESIGN.md',
            'docs/project/06_TECHNICAL_PLAN.md',
            'docs/project/07_BOOTSTRAP.md',
            'docs/design/05_VISUAL_TARGET_OPTION1_WINDOWS_NATIVE.jpg'
          )
          foreach ($path in $required) {
            if (-not (Test-Path $path)) { throw "Missing canonical bootstrap artifact: $path" }
          }
