name: replace-legacy-image-fixture

on:
  push:
    branches: [build/phase-10]
    paths:
      - .github/workflows/replace-legacy-image-fixture.yml

permissions:
  contents: write

jobs:
  replace:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: build/phase-10
      - name: Replace invalid linked-image fixture with known embedded-image DOC
        shell: bash
        run: |
          curl --fail --location --silent --show-error \
            https://raw.githubusercontent.com/apache/poi/671a20eb38ec9ed1a84cce80483d790000514ba9/test-data/document/PngPicture.doc \
            --output tests/WordToExcel.Tests/Fixtures/LegacyDoc/embedded-image.doc
          test "$(stat -c%s tests/WordToExcel.Tests/Fixtures/LegacyDoc/embedded-image.doc)" -eq 14336
      - name: Commit replacement fixture
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/WordToExcel.Tests/Fixtures/LegacyDoc/embedded-image.doc
          git diff --cached --quiet && exit 0
          git commit -m "test(t005): use verified embedded-image DOC fixture"
          git push origin HEAD:build/phase-10
